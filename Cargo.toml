[package]
name = "wlrix-tray"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX application indicator tray — the StatusNotifierItem dock in the corner of the desktop."
repository = "https://github.com/wlRIX/wlrix-tray"
publish = false

[dependencies]
# The Wayland client. The tray is a wlr-layer-shell **bottom** surface drawn into a plain shm
# buffer -- the same shape as `wlrix-desktop`, whose `ui` module this follows. Unlike that one
# it is *sized*: the surface is exactly as big as the strip it draws, and it asks for a new size
# every time an item comes or goes.
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# The event loop. The Wayland connection, the D-Bus threads' channel and the SIGHUP ping are all
# sources on one loop, so an item appearing and a pointer moving arrive the same way and nothing
# polls.
calloop = "0.13"
# Puts the Wayland connection's fd on calloop. 0.3 rather than the newer 0.4, which wants
# calloop 0.14: 0.13 is what the rest of wlRIX pins, and one calloop across the workspace is
# worth more than a point release here.
calloop-wayland-source = "0.3"
# D-Bus. This program *is* `org.kde.StatusNotifierWatcher`: without it running, fcitx5 and Steam
# publish no item at all, so the bus side is not an accessory to the window -- it is the reason
# the window has anything in it.
#
# The default `async-io` and `blocking-api` features are kept and `tokio` is deliberately not
# enabled, as in `wlrix-idle`, the portal and the settings daemon. No async runtime touches the
# calloop side; see `src/sni/mod.rs`.
zbus = "5"
# The config file. TOML is wlRIX's config format throughout.
serde = { version = "1", features = ["derive"] }
toml = "1"
# The shared UI crate: the canvas, the Motif bevel, the widgets, the fonts, the image decoder and
# the palette. Pinned by rev rather than taken by path, so this repo still builds from a fresh
# standalone clone -- the same shape as the smithay pin in `wlrix-compositor`. `just link-ui` in
# `wlrix-epoch` patches in a sibling checkout while working on both sides.
#
# `image` is on: an item's icon is usually a themed name pointing at an SVG or a PNG on disk, and
# decoding those is exactly what that feature is. The *other* icon source -- `IconPixmap`, raw
# ARGB straight off the bus -- is decoded here in `src/pixmap.rs`, because `Image`'s pixel vector
# is private and adding a constructor would put four consumers in lockstep for sixty lines.
wlrix-ui = { git = "https://github.com/wlRIX/wlrix-ui", rev = "33c693db461331cf183fb4e5090fb5c6be71a6f5", features = ["image"] }
# Resolving an `IconName` to a file: index.theme parsing, theme inheritance, size and scale
# directories, and the `/usr/share/pixmaps` fallback. All of that is the icon-theme spec, and
# reimplementing it to get the awkward cases wrong would be a poor trade. Same version and same
# reasoning as `wlrix-desktop`.
freedesktop-icons = "0.4.0"
# `O_NOFOLLOW` on the pidfile and `kill` for the reload handler. Already in the tree by way of
# calloop and smithay-client-toolkit, so it costs nothing new.
libc = "0.2"
